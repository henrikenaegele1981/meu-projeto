<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="assets/fontes/fonts.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;font-family:Poppins;color:#fff;background:#070a14}
#bg{position:absolute;inset:0;background:url(assets/mapa/world4096.jpg) 72% 30%/560% auto;filter:brightness(.4) saturate(.85)}
#bg2{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(7,10,20,.2),rgba(7,10,20,.95) 75%)}
.pills{position:absolute;top:330px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.p{font-weight:800;font-size:28px;letter-spacing:2px;padding:6px 22px;border-radius:30px;text-transform:uppercase}
.h{position:absolute;left:60px;right:60px;text-align:center;font-weight:900;text-transform:uppercase;line-height:1.0;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.card{position:absolute;left:120px;top:800px;width:840px;height:500px;border:8px solid #fff;border-radius:10px;overflow:hidden;transform:rotate(-2.5deg);box-shadow:0 30px 70px rgba(0,0,0,.8)}
.card img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.stamp{position:absolute;left:300px;top:1185px;text-transform:uppercase;font-size:76px!important;border:10px solid #e8213a;color:#e8213a;background:rgba(255,255,255,.94);font-weight:900;padding:0 30px;border-radius:14px;transform:rotate(-9deg);letter-spacing:3px}
.cred{position:absolute;left:150px;top:820px;font-size:17px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:5px;transform:rotate(-2.5deg)}
.badge{position:absolute;left:50%;transform:translateX(-50%);top:1500px;display:flex;align-items:center;gap:14px;background:rgba(8,10,18,.8);border:2px solid rgba(255,255,255,.2);padding:6px 24px 6px 6px;border-radius:50px}
.badge img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:3px solid #fff}
.badge span{font-weight:700;font-size:26px}
</style></head><body><div id="bg"></div><div id="bg2"></div>
<div class="pills"><span class="p" style="background:#e8213a">A declaração</span><span class="p" style="border:3px solid rgba(255,255,255,.6)">que ninguém leu</span></div>
<div class="h" style="top:410px;font-size:84px">Trump, Putin e Xi</div>
<div class="h" style="top:510px;font-size:122px;color:#ffc928">dividiram<br>o mundo?</div>
<div class="card"><img src="assets/fotos/encontro.jpg"></div>
<div class="stamp">Não procede</div>
<div class="cred">Foto: Kremlin.ru (CC BY 4.0)</div>
<div class="h" style="top:1370px;font-size:50px">O que eles <span style="color:#e8213a">assinaram de verdade</span></div>
<div class="badge"><img src="assets/perfil.jpg"><span>@josehenriquenaegele</span></div>
</body></html>
