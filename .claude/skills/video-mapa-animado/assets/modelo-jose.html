<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;font-weight:600;src:url(./node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(./node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:900;src:url(./node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b1a2c;font-family:I,"Noto Color Emoji",sans-serif}
#fundo{position:absolute;inset:0;transition:none}
#mapa{position:absolute;inset:0}
#palco{position:absolute;inset:0}
#vin{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}
#leg{position:absolute;left:70px;right:70px;top:1210px;text-align:center;font-weight:900;font-size:76px;line-height:1.08;color:#fff;text-transform:uppercase;letter-spacing:-1px;text-shadow:0 4px 18px rgba(0,0,0,.7)}
#leg .am{color:#ffd21f}#leg .vm{color:#ff2d3d}
.marca{position:absolute;right:70px;top:1560px;font-weight:600;font-size:28px;color:rgba(255,255,255,.55)}
.pill{position:absolute;background:rgba(10,14,22,.86);border:3px solid #ff2d3d;box-shadow:0 0 18px rgba(255,45,61,.55),inset 0 0 10px rgba(255,45,61,.15);color:#fff;font-weight:800;font-size:38px;padding:14px 24px;border-radius:16px;white-space:nowrap}
.pill.verde{border-color:#2fe37a;box-shadow:0 0 18px rgba(47,227,122,.55)}
.pill.ciano{border-color:#2fd6e8;box-shadow:0 0 18px rgba(47,214,232,.55)}
.pill.ouro{border-color:#ffd21f;box-shadow:0 0 18px rgba(255,210,31,.5)}
.card{position:absolute;background:rgba(13,18,28,.93);border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.55);color:#fff;padding:28px 34px}
.card .cab{display:flex;align-items:center;gap:16px}.card .av{width:64px;height:64px;border-radius:50%;background:#2b3444;display:flex;align-items:center;justify-content:center;font-size:36px}
.card .nm{font-weight:800;font-size:34px}.card .sub{font-weight:600;font-size:26px;color:#8b96a8}
.card .tx{font-weight:600;font-size:38px;line-height:1.3;margin-top:16px}.card .al{font-weight:800;font-size:26px;color:#ff4d5a;margin-top:14px}
.am{color:#ffd21f}.vm{color:#ff4d5a}.vd{color:#2fe37a}
.emo{position:absolute;font-family:"Noto Color Emoji";line-height:1}
</style></head><body>
<canvas id="fundo" width="1080" height="1920"></canvas>
<svg id="mapa" width="1080" height="1920"><defs>
 <filter id="textura" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feColorMatrix type="saturate" values="0" in="n" result="g"/><feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope=".55"/></feComponentTransfer><feComposite in="g2" in2="SourceGraphic" operator="in" result="tx"/><feBlend in="SourceGraphic" in2="tx" mode="multiply"/></filter>
 <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <g id="terras" filter="url(#textura)"></g><g id="destaque" filter="url(#neon)"></g><g id="extra"></g></svg>
<div id="palco"></div><div id="vin"></div><div id="leg"></div><div class="marca">@josehenriquenaegele</div>
<script>
/* ===== CONFIGURAÇÃO DO VÍDEO (edite aqui) =====
   tempos: saída do alinhar.py (cenas = parágrafos do roteiro, palavras com tempo)
   abertura: trecho de vídeo de terceiro no começo (ou null para começar direto no mapa) */
window.CFG = {
  tempos: "tempos.json",
  abertura: { palavras: "abertura/palavras.json", quadros: "abertura/f_", total: 318, dur: 10.4,
              rotulo: "🎙️ NOME • CARGO" }
};
</script>
<script src="./node_modules/d3/dist/d3.min.js"></script>
<script src="./node_modules/topojson-client/dist/topojson-client.min.js"></script>
<script>
(async()=>{
const T=await (await fetch(CFG.tempos)).json();
const AB=CFG.abertura; const ERIKA=AB?await (await fetch(AB.palavras)).json():[];
const E=AB?AB.dur:0, OFF=AB?E+0.35:0.3;
const topo=await (await fetch("./node_modules/world-atlas/countries-50m.json")).json();
const paises=topojson.feature(topo,topo.objects.countries).features.filter(f=>f.properties.name!=="Antarctica");
const BR=paises.find(f=>f.properties.name==="Brazil"), PY=paises.find(f=>f.properties.name==="Paraguay");
const NS="http://www.w3.org/2000/svg", gT=document.getElementById("terras"), gD=document.getElementById("destaque"), gX=document.getElementById("extra"), svg=document.getElementById("mapa");
const paths=paises.map(f=>{const p=document.createElementNS(NS,"path");gT.appendChild(p);return [f,p];});
const hl={br:document.createElementNS(NS,"path"),py:document.createElementNS(NS,"path")}; gD.appendChild(hl.br); gD.appendChild(hl.py);
const cl=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-cl(x),3), lerp=(a,b,k)=>a+(b-a)*k, back=x=>{x=cl(x);return 1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2);};
const mix=(a,b,k)=>a.map((v,i)=>Math.round(lerp(v,b[i],k)));
// climas: [oceano, terra]
const CLIMA={neutro:[[14,34,58],[118,140,96]], negativo:[[38,20,40],[150,128,90]], positivo:[[10,52,52],[104,160,110]]};
const climaDe=ci=> ci<0?"neutro": (ci>=11&&ci<=16)||ci===3 ? "negativo" : ci>=17 ? "positivo" : "neutro";
const fc=document.getElementById("fundo").getContext("2d");
function fundo(oc){ const g=fc.createRadialGradient(540,900,100,540,900,1300); g.addColorStop(0,`rgb(${oc.map(v=>v+14)})`); g.addColorStop(1,`rgb(${oc.map(v=>Math.max(0,v-10))})`); fc.fillStyle=g; fc.fillRect(0,0,1080,1920); }
// câmera do mapa por cena: [lon, lat, escala]
const CAM={"-1":[-25,5,300],0:[-53,-14,1150],1:[-53,-14,1150],2:[-53,-14,1150],3:[-53,-14,1150],4:[-53,-14,1150],5:[-53,-14,1150],6:[-53,-14,1150],7:[-53,-14,1150],8:[-53,-14,1150],
  9:[-47,-23,2600],10:[-47,-23,2600],11:[-47.9,-15.8,3200],12:[-47.9,-15.8,3200],13:[-47.9,-15.8,3200],14:[-53,-14,1150],15:[-53,-14,1150],16:[-30,20,420],
  17:[-54.6,-25.5,7000],18:[-57.5,-23.4,3600],19:[-54,-19,1500],20:[-56,-24,3000],21:[-56,-24,3000]};
function camera(ci,lt){ const alvo=CAM[ci], de=CAM[ci-1]||alvo; const k=ease(lt/1.4);
  return [lerp(de[0],alvo[0],k),lerp(de[1],alvo[1],k),Math.exp(lerp(Math.log(de[2]),Math.log(alvo[2]),k))]; }
function clima(ci,lt){ const alvo=CLIMA[climaDe(ci)], de=CLIMA[climaDe(ci-1)]; const k=ease(lt/1);
  return [mix(de[0],alvo[0],k),mix(de[1],alvo[1],k)]; }
let pontos=null;
function mapa(ci,t,lt){ const [lon,lat,sc]=camera(ci,lt); const [oc,te]=clima(ci,lt); fundo(oc);
  const proj=d3.geoMercator().center([lon,lat]).scale(sc).translate([540,900]); const gp=d3.geoPath(proj);
  for(const [f,p] of paths){ p.setAttribute("d",gp(f)||""); p.setAttribute("fill",`rgb(${te})`); }
  const brOn=[0,1,2,8,14,15,19].includes(ci), pyOn=ci>=17;
  hl.br.setAttribute("d",brOn?gp(BR):""); hl.br.setAttribute("fill",ci===19?"rgba(255,45,61,.55)":"rgba(47,214,232,.55)"); hl.br.setAttribute("stroke",ci===19?"#ff2d3d":"#2fd6e8"); hl.br.setAttribute("stroke-width",4);
  hl.py.setAttribute("d",pyOn?gp(PY):""); hl.py.setAttribute("fill","rgba(47,227,122,.6)"); hl.py.setAttribute("stroke","#2fe37a"); hl.py.setAttribute("stroke-width",5);
  let x="";
  if(ci===0){ if(!pontos){pontos=[];let s=3;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};while(pontos.length<300){const ll=[-73+r()*39,-33+r()*38];if(d3.geoContains(BR,ll))pontos.push(ll);}}
    const n=Math.floor(ease(lt/5)*300); x+=pontos.slice(0,n).map(ll=>{const[a,b]=proj(ll);return `<circle cx="${a}" cy="${b}" r="6" fill="#ffd21f" stroke="#1b1b1b" stroke-width="1.5"/>`;}).join(""); }
  if(ci===17){ const [a,b]=proj([-54.59,-25.51]); const k=ease((lt-1.5)/1); x+=`<circle cx="${a}" cy="${b}" r="${lerp(0,70,k)}" fill="none" stroke="#ffd21f" stroke-width="8"/>`; }
  gX.innerHTML=x; return proj; }
// ---- legenda estilo José: blocos de 2–4 palavras, palavra-chave amarela (ou vermelha) ----
const NEG=/^(imposto|impostos|juros|governo|estado|explora|exausto|sugado|cansado|injusto|mentira|cobra)$/i;
function blocos(ws){ const out=[]; let cur=[]; for(const w of ws){ cur.push(w); const fim=/[.,?!…:]$/.test(w.w); if(cur.length>=4||(fim&&cur.length>=2)||(cur.length>=3&&w.w.length>8)){out.push(cur);cur=[];} } if(cur.length) out.push(cur); return out; }
const BE=blocos(ERIKA), BN=blocos(T.palavras);
function legenda(t){ let bl, tt=t; if(t<E){bl=BE;} else {bl=BN; tt=t-OFF;}
  const b=bl.find((g,i)=>g[0].ini<=tt && tt<(bl[i+1]?bl[i+1][0].ini:g[g.length-1].fim+.4));
  const el=document.getElementById("leg"); if(!b){el.innerHTML="";return;}
  const L=w=>w.w.replace(/[^\wÀ-ú]/g,"").length; let ki=b.reduce((m,w,j)=>L(w)>L(b[m])?j:m,0);
  el.innerHTML=b.map((w,j)=>{const lim=w.w.replace(/[“”"]/g,""); const c=NEG.test(lim.replace(/[^\wÀ-ú]/g,""))?"vm":j===ki?"am":""; return `<span class="${c}">${lim}</span>`;}).join(" "); }
// ---- componentes ----
const pill=(x,y,txt,k,cor="")=>`<div class="pill ${cor}" style="left:${x}px;top:${y}px;opacity:${cl(k*2)};transform:scale(${lerp(.6,1,back(k))})">${txt}</div>`;
const pillC=(y,txt,k,cor="")=>`<div style="position:absolute;left:0;right:0;top:${y}px;display:flex;justify-content:center"><div class="pill ${cor}" style="position:relative;opacity:${cl(k*2)};transform:scale(${lerp(.6,1,back(k))})">${txt}</div></div>`;
const emo=(x,y,e,k,tam=110)=>`<div class="emo" style="left:${x-tam/2}px;top:${y-tam/2}px;font-size:${tam}px;opacity:${cl(k*3)};transform:scale(${lerp(.3,1,back(k))})">${e}</div>`;
const card=(x,y,w,html,k)=>`<div class="card" style="left:${x}px;top:${y}px;width:${w}px;opacity:${cl(k*2)};transform:translateY(${lerp(40,0,ease(k))}px) scale(${lerp(.94,1,ease(k))})">${html}</div>`;
function linhasBarra(lt,ci){ const it=[["👷 Funcionários",4424,"R$ 4,4 bi","#2fd6e8",5],["🏦 Juros",3868,"R$ 3,9 bi","#ff2d3d",6],["🏛️ Impostos",827,"R$ 827 mi","#ff2d3d",7],["👔 Donos",497,"R$ 497 mi","#ffd21f",8]];
  return it.filter(x=>x[4]<=ci).map(([n,v,txt,cor,c])=>{const k=c===ci?ease((lt-.2)/.8):1; return `<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:34px"><span>${n}</span><span style="color:${cor};opacity:${k}">${txt}</span></div>
   <div style="height:26px;background:rgba(255,255,255,.08);border-radius:13px;margin-top:10px"><div style="height:26px;width:${Math.max(3,100*v/4424*k)}%;background:${cor};border-radius:13px;box-shadow:0 0 14px ${cor}"></div></div></div>`;}).join(""); }
const topo_=(txt,k,cor="")=>pillC(250,txt,k,cor);
function cena(ci,t,lt,proj){ const k=x=>ease((lt-x)/.5); let h="";
  switch(ci){
  case 0: h+=topo_("🇧🇷 ASSAÍ • BALANÇO 2025",k(0))+pill(110,560,"💰 R$ 84,5 BI EM VENDAS",k(1.6),"ouro")+pill(330,1040,"👷 +90 MIL FUNCIONÁRIOS",k(4.6),"ciano"); break;
  case 1: h+=topo_("🇧🇷 ASSAÍ • BALANÇO 2025",1)+emo(400,700,"💰",k(.2),180)+emo(660,700,"🏊",k(1.2),150)+emo(540,920,"❓",k(2.4),130); break;
  case 2: h+=topo_("🇧🇷 ASSAÍ • BALANÇO 2025",1)+card(120,560,840,`<div class="cab"><div class="av">📄</div><div><div class="nm">Sendas Distribuidora S.A.</div><div class="sub">Balanço oficial · 31/12/2025</div></div></div><div class="tx">O dono foi <span class="am">quem menos levou</span>.</div><div class="al">✅ documento auditado · publicado na CVM</div>`,k(.4)); break;
  case 3: h+=emo(540,780,"🤔",k(.1),200)+topo_("VENDE BILHÕES… E FICA COM TÃO POUCO?",k(.3)); break;
  case 4: h+=topo_("🪙 O CAMINHO DE CADA REAL",k(0),"ouro")+emo(lerp(200,880,ease(lt/2.6)),780+Math.sin(lt*4)*60,"🪙",k(0),120); break;
  case 5: case 6: case 7: case 8: h+=topo_("🇧🇷 ASSAÍ • PARA ONDE FOI O DINHEIRO",1)+card(90,440,900,linhasBarra(lt,ci),ci===5?k(0):1);
     if(ci===8) h+=pillC(1060,"⚠️ MENOS DE R$ 6 A CADA R$ 1.000",k(3.2),"ouro"); break;
  case 9: h+=topo_("👷 SEU ANTÔNIO • REPOSITOR",k(0),"ciano")+emo(540,760,"🛒",k(.5),200)+emo(720,640,"🌙",k(1),110); break;
  case 10: if(lt<9) h+=topo_("🧮 A CONTA DA DEPUTADA",k(0),"ouro")+card(120,560,840,`<div class="tx" style="margin:0">Lucro dos donos: <span class="am">R$ 497 mi</span><br>÷ 90 mil funcionários ÷ 12 meses</div><div style="font-weight:900;font-size:86px;color:#ffd21f;margin-top:14px">= R$ 460/mês</div>`,k(.3));
           else h+=topo_("🧮 A CONTA DA DEPUTADA",1,"ouro")+emo(540,760,"🔒",k(9.1),200)+pillC(940,"🚫 LOJA FECHADA • SEM VAGAS",k(9.6)); break;
  case 11: h+=topo_("🏛️ BRASÍLIA • GOVERNO",k(0))+emo(540,800,"🏛️",k(.5),190); break;
  case 12: h+=topo_("🏛️ A MESMA CONTA… COM O GOVERNO",1)+card(120,520,840,`<div class="tx" style="margin:0">🏛️ Impostos ÷ 90 mil ÷ 12</div><div style="font-weight:900;font-size:76px;color:#ff4d5a">= R$ 766/mês</div><div class="tx">🏦 Juros ÷ 90 mil ÷ 12</div><div style="font-weight:900;font-size:76px;color:#ff4d5a">= R$ 3.581/mês</div>`,k(.2)); break;
  case 13: h+=topo_("🏦 DE ONDE VÊM OS JUROS",k(0))+card(120,560,840,`<div class="cab"><div class="av">🏛️</div><div><div class="nm">Governo federal</div><div class="sub">gasta mais do que arrecada</div></div></div><div class="tx">Pega dinheiro emprestado → <span class="vm">juros sobem para todo mundo</span>.</div>`,k(.5)); break;
  case 14: h+=topo_("⚖️ QUEM EXPLORA QUEM?",k(0))+emo(300,760,"🏢",k(.6),150)+emo(780,760,"👷",k(1.2),150)+pillC(560,"👔 O PATRÃO?",k(.8),"ouro")+(lt>4?pillC(940,"🏛️ O ESTADO EXPLORA OS DOIS",k(4.5)):""); break;
  case 15: h+=topo_("💸 COMO O ESTADO COBRA",1)+pill(90,560,"🏢 DO RICO, NA EMPRESA",k(.3))+pill(330,1000,"🛒 DO POBRE, NO CONSUMO",k(3.5))+emo(270,800,"🧾",k(.6),130)+emo(560,800,"🍚",k(3.9),110)+emo(700,800,"🫘",k(4.3),110)+emo(840,800,"🔥",k(4.7),110); break;
  case 16: h+=topo_("📜 RERUM NOVARUM • LEÃO XIII, 1891",k(0),"ouro")+card(120,560,840,`<div class="tx" style="margin:0;font-size:44px">“O Estado é injusto quando, a título de impostos, tira de quem trabalha <span class="am">mais do que é justo</span>.”</div><div class="sub" style="margin-top:16px">paráfrase · Doutrina Social da Igreja</div>`,k(.4)); break;
  case 17: h+=topo_("🌉 PONTE DA AMIZADE",k(0),"verde")+pill(130,560,"🇧🇷 FOZ DO IGUAÇU",k(1.2),"ciano")+pill(520,1040,"🇵🇾 CIUDAD DEL ESTE",k(1.8),"verde"); break;
  case 18: if(lt<8.6){ h+=topo_("🇵🇾 PARAGUAI • LEI 6.380/2019",k(0),"verde")+pill(100,520,"🏢 10% EMPRESA",k(1.4),"verde")+pill(560,620,"👤 ATÉ 10% RENDA",k(2.6),"verde")+pill(260,1040,"🛒 10% CONSUMO",k(3.8),"verde"); }
     else { const q1=ease((lt-8.6)/.9), q2=ease((lt-9.6)/.9); h+=topo_("📊 IMPOSTOS SOBRE O PIB (estimativas)",1,"verde")+card(120,480,840,`<div style="display:flex;justify-content:space-around;align-items:flex-end;height:520px">
        <div style="text-align:center"><div style="font-weight:900;font-size:64px;color:#2fe37a;opacity:${q1}">~14%</div><div style="width:200px;height:${q1*200}px;background:#2fe37a;border-radius:10px;box-shadow:0 0 18px #2fe37a"></div><div style="font-weight:800;font-size:36px;margin-top:12px">🇵🇾 Paraguai</div></div>
        <div style="text-align:center"><div style="font-weight:900;font-size:64px;color:#ff4d5a;opacity:${q2}">30%+</div><div style="width:200px;height:${q2*430}px;background:#ff2d3d;border-radius:10px;box-shadow:0 0 18px #ff2d3d"></div><div style="font-weight:800;font-size:36px;margin-top:12px">🇧🇷 Brasil</div></div></div>`,1); } break;
  case 19: { h+=topo_("🌉 OS DOIS LADOS DA PONTE",k(0),"verde"); const [bx,by]=proj([-49,-11]), [px,py]=proj([-58,-23]); h+=emo(bx,by,"⛓️",k(1),140)+emo(px+40,py,"🌿",k(4.5),120); } break;
  case 20: h+=topo_("🇵🇾 O OUTRO LADO",k(0),"verde")+emo(330,720,"🏙️",k(.4),130)+emo(540,640,"🏡",k(.9),130)+emo(750,720,"💼",k(1.4),130); break;
  case 21: h+=card(110,520,860,`<div style="text-align:center;font-size:110px;line-height:1">🇵🇾</div><div style="text-align:center;font-weight:900;font-size:84px;letter-spacing:1px;margin-top:10px">PARAGUAI<br><span class="vd">SEM FILTRO</span></div><div style="text-align:center;font-weight:600;font-size:34px;color:#8b96a8;margin-top:12px">viver • trabalhar • empreender</div>`,k(0))
       +pillC(1060,"👆 LINK NA BIO",k(1.2),"verde"); break; }
  return h; }
let carregando=[];
function abertura(t){ const f=Math.min(AB.total,Math.floor(t*30)+1); const q=ease(t/.5);
  return `<div style="position:absolute;left:120px;top:440px;width:840px;height:896px;border-radius:26px;overflow:hidden;border:4px solid #ff2d3d;box-shadow:0 0 34px rgba(255,45,61,.55),0 30px 70px rgba(0,0,0,.6);transform:scale(${lerp(.92,1,q)}) rotate(-1.2deg);opacity:${q};background:#000">
     <img src="${AB.quadros}${String(f).padStart(4,"0")}.jpg" style="width:840px;height:896px;object-fit:cover;display:block"></div>`
   + pillC(250,AB.rotulo,ease((t-.3)/.4)); }
window.render=(t)=>{ const palco=document.getElementById("palco"); let h="";
  if(t<E){ svg.style.opacity=1; mapa(-1,t,0); h=abertura(t); }
  else { svg.style.opacity=1; const tn=t-OFF; let ci=T.cenas.findIndex(c=>tn>=c.ini&&tn<c.fim); if(ci<0) ci=tn<0?0:T.cenas.length-1;
         const lt=tn-T.cenas[ci].ini; const proj=mapa(ci,t,lt); h=cena(ci,t,lt,proj); }
  palco.innerHTML=h; document.getElementById("leg").style.top=(t<E?1400:1210)+"px"; legenda(t);
  return Promise.all([...document.images].map(i=>i.complete&&i.naturalWidth?1:i.decode().catch(()=>1))); };
window.DURACAO=OFF+T.duracao; window.pronto=true;
})();
</script></body></html>
